# ===================================================================
# Smart Port & Airport Baggage Tracking System
# Application Configuration
# ===================================================================

spring.application.name=Smart-Baggage-Tracking-System
server.port=8080

# -------------------------------------------------------------------
# Database Configuration (MySQL + Spring JDBC)
# -------------------------------------------------------------------
# Database credentials can be overridden via environment variables:
#   DB_URL, DB_USERNAME, DB_PASSWORD
# If not provided, the defaults below will be used.
#
# Placeholder defaults:
# - DB_URL: jdbc:mysql://localhost:3306/baggage_db
# - DB_USERNAME: root
# - DB_PASSWORD: (empty password by default)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/baggage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:cse@29}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# Database Initialization (schema.sql and data.sql)
# -------------------------------------------------------------------
# 'always' runs schema.sql and data.sql on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=true

# -------------------------------------------------------------------
# Thymeleaf Template Engine Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging level
logging.level.com.example.usecaseprj=DEBUG
